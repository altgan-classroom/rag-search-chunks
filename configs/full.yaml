# EVERYTHING ON: the previous "advanced" recipe, kept for corpora where the cheap recipe's recall is not enough.
# Measured cost on the real corpus (docs/COMPARISON.md): the cross-encoder adds ~2-3 s per query on a CPU laptop and no measurable
# recall@5 gain there. Try it on YOUR corpus with `make ladder` before turning it on.
description: "Structure-aware parent-child chunks + hybrid + cross-encoder rerank + MMR + agentic generation"
embedding:
  dense_model: BAAI/bge-small-en-v1.5
  sparse_model: Qdrant/bm25
chunking:
  strategy: structure
  size: 350
  overlap: 50
  parent_child: true
  parent_size: 1500
  keep_tables_whole: true
  contextual: false          # flip on when an LLM key is available (docs/TECHNIQUES.md)
retrieval:
  mode: hybrid
  top_k: 40
  fusion: rrf
  rerank: {enabled: true, model: "Xenova/ms-marco-MiniLM-L-12-v2", top_n: 8}
  mmr_lambda: 0.7
  parent_expand: true
  final_k: 6
generation:
  verify_grounding: true
  corrective: true
