# Production-shaped stack. Source is baked into the image (no bind-mounted code, no --reload); use
# docker-compose.dev.yml for hot reload. Secrets come from deployment/.env (see .env.example).
name: orca
x-app: &app
  build: {context: .., dockerfile: Dockerfile}
  env_file: [.env]
  restart: unless-stopped
  networks: [internal]
  volumes: [orca_data:/data]

services:
  qdrant:
    image: qdrant/qdrant:v1.20.2           # matches qdrant-client 1.20 (REVIEW D5: baseline mixed 1.8 server / 1.7+1.12 clients)
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY}   # the env names Qdrant actually reads (REVIEW D1)
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes: [qdrant_storage:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]          # not exposed beyond localhost
    healthcheck:                            # real readiness probe via bash /dev/tcp (the image has no curl)
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -n1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [internal]
    deploy: {resources: {limits: {memory: 2g}}}

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    networks: [internal]                    # not published to the host

  api:
    <<: *app
    ports: ["8080:8080"]
    environment:
      ORCA_QDRANT__URL: http://qdrant:6333
      ORCA_QDRANT__API_KEY: ${QDRANT_API_KEY}
    depends_on: {qdrant: {condition: service_healthy}}
    deploy: {resources: {limits: {memory: 3g}}}

  worker:
    <<: *app
    command: ["celery", "-A", "orca_rag.ingestion.tasks", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      ORCA_QDRANT__URL: http://qdrant:6333
      ORCA_QDRANT__API_KEY: ${QDRANT_API_KEY}
      ORCA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    healthcheck:
      test: ["CMD-SHELL", "celery -A orca_rag.ingestion.tasks inspect ping -d celery@$$HOSTNAME | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    depends_on:
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 4g}}}

  web:
    profiles: ["web"]
    build: {context: ../web/orca, dockerfile: Dockerfile, args: {VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8080}"}}
    ports: ["3002:80"]
    depends_on: [api]
    networks: [internal]

networks: {internal: {}}
volumes: {qdrant_storage: {}, redis_data: {}, orca_data: {}}
