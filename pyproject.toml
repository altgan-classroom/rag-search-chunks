[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-rag"
version = "2.0.0"
description = "Production-grade RAG reference: advanced ingestion, hybrid retrieval, agentic generation, and a measurable eval harness."
requires-python = ">=3.11"
dependencies = [
  "llama-index-core>=0.14,<0.15",
  "llama-index-llms-litellm>=0.8",
  "litellm>=1.80",
  "qdrant-client>=1.15,<2",
  "fastembed>=0.7",
  "pymupdf>=1.24",
  "pymupdf4llm>=0.0.17",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "numpy>=1.26",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
ingest = ["celery[redis]>=5.4", "pytesseract>=0.3", "pillow>=10", "boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "integration: needs network/models/docker (deselect with -m 'not integration')",
  "llm: needs a real LLM key",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E701", "E702", "E731", "E741"]   # long lines/compact one-liners are deliberate in places; lint for real defects
